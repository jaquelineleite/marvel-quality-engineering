name: Quality Gate

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MARVEL_API_URL: https://api.marvelapp.com/graphql/

jobs:
  api-tests:
    name: API - Robot Framework and k6
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      MARVEL_API_TOKEN: ${{ secrets.MARVEL_API_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api-tests/requirements.txt

      - name: Validate required API secret
        shell: bash
        run: |
          if [ -z "$MARVEL_API_TOKEN" ]; then
            echo "::error::MARVEL_API_TOKEN repository secret is not configured."
            exit 1
          fi

      - name: Install API test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api-tests/requirements.txt

      - name: Run Robot Framework API tests
        run: |
          robot \
            --outputdir api-tests/results \
            api-tests/tests

      - name: Upload Robot Framework evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: robot-api-results
          path: api-tests/results/
          if-no-files-found: warn
          retention-days: 14

      - name: Set up Node.js for Newman
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run Postman API smoke collection with Newman
        run: |
          npx --yes newman@6.2.2 run \
            postman/marvel-developer-api.postman_collection.json \
            --env-var "MARVEL_API_TOKEN=$MARVEL_API_TOKEN"

      - name: Set up k6
        uses: grafana/setup-k6-action@v1

      - name: Run API performance smoke test
        run: k6 run performance/k6/smoke.js

  ui-tests:
    name: UI - Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui-tests/package-lock.json

      - name: Install UI dependencies
        working-directory: ui-tests
        run: npm ci

      - name: Install Chromium
        working-directory: ui-tests
        run: npx playwright install --with-deps chromium

      - name: Validate TypeScript
        working-directory: ui-tests
        run: npx tsc --noEmit

      - name: Run Playwright quality suite
        working-directory: ui-tests
        run: npx playwright test --project=chromium

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - api-tests
      - ui-tests

    steps:
      - name: Evaluate quality gate
        shell: bash
        run: |
          echo "API job result: ${{ needs.api-tests.result }}"
          echo "UI job result:  ${{ needs.ui-tests.result }}"

          if [ "${{ needs.api-tests.result }}" != "success" ]; then
            echo "::error::API quality gate failed."
            exit 1
          fi

          if [ "${{ needs.ui-tests.result }}" != "success" ]; then
            echo "::error::UI quality gate failed."
            exit 1
          fi

          echo "Quality Gate PASSED."
